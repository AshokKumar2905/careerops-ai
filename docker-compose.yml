services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: careerops-backend:1.1
    container_name: careerops-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: careerops-frontend:1.2
    container_name: careerops-frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
